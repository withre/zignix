name: Update Zig pins

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-zig-pins
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update pins
        run: python3 scripts/update-zig-master-pins.py

      # Paths are directories rather than a file list, so a new release
      # line (packages/zig-<major>_<minor>/) needs no change here.
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- packages README.org examples/pin-specific-build; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify builds
        if: steps.changes.outputs.changed == 'true'
        # Only x86_64-linux is built here. The other systems' hashes are
        # deterministic conversions of upstream shasums (see the update
        # script), so they are not fetched/built on this runner.
        # Blueprint adds a pkgs-<name> check per package, so this covers
        # every pin without listing them. The example is built too: it
        # shares the master pin, but its Zig source has to compile with the
        # new build, and a broken example should block the bump.
        run: |
          nix flake check -L
          nix build ./examples/pin-specific-build#hello --no-link -L

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          master=$(grep -m1 'version = ' packages/zig-master/default.nix | cut -d'"' -f2)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -u: stage only the tracked files the update script edits.
          git add -u -- packages README.org examples/pin-specific-build
          git commit -m "Update Zig pins (master ${master})"
          git push
